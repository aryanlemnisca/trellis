name: Deploy

# dev  -> https://lemnisca.dev.corevoice.in/   built here, shipped to the dev-sites container
# main -> production                           NOT WIRED YET (no production host decided); see README "Deploy"
# PRs only build and run the SEO gate. Promote by opening a PR from dev into main.
# Pattern: cv-server-infra docs/staging.md (build in Actions, tar.gz over a pinned-command SSH key).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same code as production, built for the dev host's root.
      - name: Build for lemnisca.dev.corevoice.in
        run: npm run build
        env:
          SITE_URL: https://lemnisca.dev.corevoice.in
          PUBLIC_DEMO_FORM_HOOK: ${{ vars.PUBLIC_DEMO_FORM_HOOK }}
      # Fails on missing meta, broken anchors, FAQ schema drift, robots/sitemap mismatch.
      - name: SEO / AEO gate
        run: node scripts/check-seo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  dev:
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer push replaces an older one. Safe: the server only swaps a fully received, checked archive.
    concurrency:
      group: deploy-lemnisca-dev
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The key's authorized_keys entry forces `/opt/dev-sites/receive.sh lemnisca`:
      # it can only replace this one dev site, never production.
      - name: Ship dist/ to dev-sites
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY_DEV }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_DEV }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::secret DEPLOY_SSH_KEY_DEV is not set"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::secret DEPLOY_HOST_DEV is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              root@"$DEPLOY_HOST"
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
      # A deploy is done when the live page answers with the new build.
      - name: Verify live
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /tmp/live.html https://lemnisca.dev.corevoice.in/
          grep -q '<title>' /tmp/live.html
          { echo "### Dev deploy"; echo "Live at https://lemnisca.dev.corevoice.in/ (${GITHUB_SHA::7})"; } >> "$GITHUB_STEP_SUMMARY" || true
